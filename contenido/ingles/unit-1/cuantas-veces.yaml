titulo: Once, twice…
subtitulo: ¿Cuántas veces?
emoji: 🔢
ejercicios:
  - tipo: recuerda
    titulo: ¿Cuántas veces?
    texto: |
      Para decir cuántas veces hacemos algo, en inglés hay palabras especiales para 1 y 2.
    tabla:
      - ['0', never]
      - ['1 vez', once]
      - ['2 veces', twice]
      - ['3 veces', three times]
      - ['4 veces', four times]

  - tipo: recuerda
    titulo: a day, a week
    texto: |
      **a day** = al día
      **a week** = a la semana
      **every day** = todos los días
    ejemplos:
      - twice a day
      - once a week
      - three times a week

  - tipo: unir
    enunciado: Une cada número con su palabra.
    pares:
      - ['0', never]
      - ['1', once]
      - ['2', twice]
      - ['3', three times]

  - tipo: elegir
    enunciado: ¿Cómo se dice?
    tarjeta: { dibujo: '🔁', texto: '2 veces a la semana' }
    correcta: twice a week
    incorrectas:
      - texto: two times a week
        feedback: Para 2 veces se usa una palabra especial, **twice**.
      - texto: twice a day
        feedback: '*a day* es «al día». A la semana es **a week**.'

  - tipo: elegir
    enunciado: ¿Cómo se dice?
    tarjeta: { dibujo: '🔁', texto: '1 vez al día' }
    correcta: once a day
    incorrectas:
      - texto: one time a day
        feedback: Para 1 vez se usa una palabra especial, **once**.
      - texto: once a week
        feedback: '*a week* es «a la semana». Al día es **a day**.'

  - tipo: elegir
    enunciado: ¿Cómo se dice?
    tarjeta: { dibujo: '🔁', texto: '3 veces a la semana' }
    correcta: three times a week
    incorrectas:
      - texto: three time a week
        feedback: Con 3, **times** lleva -s, porque son varias veces.
      - texto: twice a week
        feedback: '*twice* son 2 veces. Para 3 se dice **three times**.'
