titulo: Los secretos de Mercurio
subtitulo: Un corazón de hierro
emoji: 🧲
ejercicios:
  - tipo: chat
    titulo: Un planeta casi todo núcleo
    mensajes:
      - de: vega
        texto: 'Mercurio se parece a la Luna por fuera: gris y lleno de cráteres. Pero por dentro es muy distinto.'
        dibujo: ⚪ 🌕
      - de: hugo
        texto: 'Su núcleo de hierro es enorme. Ocupa más de la mitad del planeta, mucho más que el de la Tierra en proporción.'
        dibujo: 🧲 🍑
      - de: santiago
        texto: 'Por eso, siendo tan pequeño, pesa bastante. Después de la Tierra, es el planeta más denso, es decir, el más apretado.'
        dibujo: ⚖️
      - de: valentina
        texto: '¿Por qué tan poca roca por fuera? Quizás hace mucho sufrió un choque gigantesco, que le arrancó gran parte de sus capas de fuera.'
        dibujo: 💥
      - de: vega
        texto: 'También tiene campo magnético, aunque débil. Eso sorprendió a todo el mundo: nadie lo esperaba en un planeta tan pequeño.'
        dibujo: 🧭
      - de: hugo
        texto: 'Y Mercurio está encogiendo. Al enfriarse su interior, el planeta se hace más pequeño y la superficie se arruga.'
        dibujo: 🍇
      - de: santiago
        texto: 'Por eso hay acantilados larguísimos, de cientos de kilómetros. ¡Son arrugas del planeta, como las de una uva pasa!'
        dibujo: 🧗

  - tipo: elegir
    enunciado: ¿Qué tiene de especial el núcleo de Mercurio?
    dibujo: ⚪ 🧲
    correcta: 🧲 Que es enorme y de hierro
    incorrectas:
      - texto: 💎 Que es de diamante
        feedback: No. Es de hierro, y ocupa más de la mitad del planeta.
      - texto: 🕳️ Que está hueco
        feedback: No. Es de hierro, y ocupa más de la mitad del planeta.

  - tipo: elegir
    enunciado: ¿Por qué tiene Mercurio acantilados tan largos?
    dibujo: 🍇
    correcta: 🍇 Porque está encogiendo
    incorrectas:
      - texto: 🌊 Por las olas del mar
        feedback: Allí no hay mar. Al enfriarse, el planeta encoge y su superficie se arruga.
      - texto: 🚜 Porque alguien excavó
        feedback: Nadie excavó. Al enfriarse, el planeta encoge y su superficie se arruga.

  - tipo: chat
    titulo: Llegar es dificilísimo
    mensajes:
      - de: valentina
        texto: 'Mercurio es de los planetas más difíciles de visitar, y eso que está más cerca que Júpiter.'
        dibujo: 🚀 😰
      - de: santiago
        texto: 'El problema es frenar. Una nave que baja hacia el Sol va cogiendo muchísima velocidad, como una bici cuesta abajo. Para quedarse en Mercurio hay que frenar a tope.'
        dibujo: 🚲 ⛰️
      - de: hugo
        texto: 'Por eso las naves usan la gravedad de los planetas para frenar: pasan cerca de la Tierra, de Venus y del propio Mercurio, varias veces.'
        dibujo: 🌍 🟡 ⚪
      - de: vega
        texto: 'La primera en visitarlo fue la Mariner diez, en 1974. La nave Messenger fue la primera en quedarse dando vueltas, en 2011, y vio el hielo.'
        dibujo: 🛰️
      - de: valentina
        texto: 'Ahora llega BepiColombo, una misión de Europa y Japón. Salió en 2018 y lleva ocho años de viaje, porque hay que frenar muy poco a poco.'
        dibujo: 🛰️ ⏳
      - de: hugo
        texto: 'Mercurio tiene además un cráter gigante, la cuenca de Caloris, más ancha que toda España.'
        dibujo: 🕳️
      - de: santiago
        texto: 'El golpe fue tan fuerte, que en el otro lado del planeta quedó el suelo roto y revuelto. ¡Como si Mercurio hubiera temblado entero!'
        dibujo: 💥 🫨

  - tipo: elegir
    enunciado: ¿Qué es lo más difícil para llegar a Mercurio?
    dibujo: 🚀 ⚪
    correcta: 🛑 Frenar la nave
    incorrectas:
      - texto: 🗺️ Encontrar el camino
        feedback: El camino se conoce bien. Lo difícil es frenar, porque la nave acelera al bajar hacia el Sol.
      - texto: ⛽ Que no hay gasolineras
        feedback: ¡Ja, ja! Sí, pero lo difícil es frenar, porque la nave acelera al bajar hacia el Sol.

  - tipo: elegir
    enunciado: ¿Cómo se llama la misión de Europa y Japón que va a Mercurio?
    dibujo: 🛰️
    correcta: 🛰️ BepiColombo
    incorrectas:
      - texto: 🚀 Apolo
        feedback: Las Apolo fueron a la Luna. La misión a Mercurio se llama BepiColombo.
      - texto: 🐶 Laika
        feedback: Laika fue una perrita del espacio. La misión a Mercurio se llama BepiColombo.
