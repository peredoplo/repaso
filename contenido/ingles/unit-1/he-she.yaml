titulo: He goes, she has
subtitulo: La -s de he y she
emoji: 👧
ejercicios:
  - tipo: recuerda
    titulo: Con he y she, el verbo lleva -s
    texto: |
      Con **I**, **you**, **we** y **they**, el verbo va tal cual.
      Con **he**, **she** (y *my sister*, *Tom*…), el verbo lleva **-s**. ¡Ojo con los especiales!
    tabla:
      - [I eat, She eats]
      - [I drink, She drinks]
      - [I make, She makes]
      - [I go, He goes]
      - [I brush, He brushes]
      - [I do, He does]
      - [I have, She has]

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: She ___ a shower every day.
    correcta: has
    incorrectas:
      - texto: have
        feedback: Con *she*, **have** cambia a **has**.
      - texto: haves
        feedback: '*have* es especial: con *she* es **has**.'

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: He ___ his teeth twice a day.
    correcta: brushes
    incorrectas:
      - texto: brush
        feedback: 'Con *he*, el verbo lleva -s. *brush* termina en -sh, así que lleva **-es**: **brushes**.'
      - texto: brushs
        feedback: 'Los verbos que terminan en -sh llevan **-es**: **brushes**.'

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: My sister always ___ to bed early.
    correcta: goes
    incorrectas:
      - texto: go
        feedback: '*My sister* es *she*: el verbo lleva -s. *go* lleva **-es**: **goes**.'
      - texto: gos
        feedback: '*go* lleva **-es**: **goes**.'

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: They ___ exercise twice a week.
    correcta: do
    incorrectas:
      - texto: does
        feedback: 'Con *they*, el verbo va tal cual, sin -s: **do**.'
      - texto: dos
        feedback: 'Con *they*, el verbo va tal cual, sin -s: **do**.'

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: She ___ fizzy drinks three times a week.
    correcta: drinks
    incorrectas:
      - texto: eats
        feedback: 'Las bebidas (*fizzy drinks*) no se comen, se beben: **drinks**.'
      - texto: drink
        feedback: 'Con *she*, el verbo lleva -s: **drinks**.'

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: We ___ healthy snacks every day.
    correcta: eat
    incorrectas:
      - texto: eats
        feedback: 'Con *we*, el verbo va tal cual, sin -s: **eat**.'
      - texto: drink
        feedback: 'Los *snacks* se comen: **eat**.'

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: My brother never ___ sweets.
    correcta: eats
    incorrectas:
      - texto: eat
        feedback: '*My brother* es *he*: el verbo lleva -s: **eats**.'
      - texto: eates
        feedback: '*eat* solo lleva **-s**: **eats**.'

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: I sometimes ___ my bed.
    correcta: make
    incorrectas:
      - texto: makes
        feedback: 'Con *I*, el verbo va tal cual, sin -s: **make**.'
      - texto: do
        feedback: '«Hacer la cama» es **make my bed**.'

  - tipo: escribir
    enunciado: Escribe el verbo **go** como va en esta frase.
    plantilla: He ___ to bed late.
    respuestas: [goes]
    explicacion: 'Con *he*, *go* lleva **-es**: **goes**.'

  - tipo: escribir
    enunciado: Escribe el verbo **brush** como va en esta frase.
    plantilla: She ___ her teeth every day.
    respuestas: [brushes]
    explicacion: 'Con *she*, *brush* lleva **-es**: **brushes**.'

  - tipo: escribir
    enunciado: Escribe el verbo **have** como va en esta frase.
    plantilla: My dad ___ a shower in the morning.
    respuestas: [has]
    explicacion: Con *he* (*my dad*), *have* cambia a **has**.

  - tipo: escribir
    enunciado: Escribe el verbo **do** como va en esta frase.
    plantilla: Lucy ___ exercise after school.
    respuestas: [does]
    explicacion: 'Con *she* (*Lucy*), *do* lleva **-es**: **does**.'

  - tipo: escribir
    enunciado: Escribe el verbo **drink** como va en esta frase.
    plantilla: Max ___ fizzy drinks once a week.
    respuestas: [drinks]
    explicacion: 'Con *he* (*Max*), el verbo lleva **-s**: **drinks**.'

  - tipo: ordenar
    enunciado: Escucha y ordena las palabras.
    escuchar: true
    piezas: usually / My mum / her bed / makes / make
    sobran: [make]
    solucion: My mum usually makes her bed.
