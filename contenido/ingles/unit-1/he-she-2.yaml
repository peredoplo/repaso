titulo: With -s or without?
subtitulo: ¿Con -s o sin -s?
emoji: 🐍
ejercicios:
  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: I sometimes ___ my bed.
    correcta: make
    incorrectas:
      - texto: makes
        feedback: 'Con *I*, el verbo va tal cual, sin -s: **make**.'
      - texto: do
        feedback: '«Hacer la cama» es **make my bed**.'

  - tipo: escribir
    enunciado: Escribe el verbo **go** como va en esta frase.
    plantilla: He ___ to bed late.
    respuestas: [goes]
    explicacion: 'Con *he*, *go* lleva **-es**: **goes**.'

  - tipo: escribir
    enunciado: Escribe el verbo **have** como va en esta frase.
    plantilla: My dad ___ a shower in the morning.
    respuestas: [has]
    explicacion: Con *he* (*my dad*), *have* cambia a **has**.

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: Lucy ___ exercise after school.
    correcta: does
    incorrectas:
      - texto: do
        feedback: 'Con *she* (*Lucy*), *do* lleva **-es**: **does**.'
      - texto: dos
        feedback: '*do* lleva **-es**: **does**.'

  - tipo: elegir
    enunciado: Elige la palabra que falta.
    pregunta: She ___ her teeth every day.
    correcta: brushes
    incorrectas:
      - texto: brush
        feedback: 'Con *she*, *brush* lleva **-es**: **brushes**.'
      - texto: brushs
        feedback: 'Los verbos que terminan en -sh llevan **-es**: **brushes**.'

  - tipo: ordenar
    piezas: three times a week / Tom / his bed / makes / make
    sobran: [make]
    enunciado: Ordena las palabras. ¡Cuidado, sobra una!
    solucion: Tom makes his bed three times a week.
    explicacion: 'Con *Tom* (*he*), el verbo lleva -s, y *three times a week* va al final: *Tom makes his bed three times a week.*'

  - tipo: ordenar
    enunciado: Escucha y ordena las palabras. ¡Sobra una!
    escuchar: true
    piezas: usually / My mum / her bed / makes / make
    sobran: [make]
    solucion: My mum usually makes her bed.
