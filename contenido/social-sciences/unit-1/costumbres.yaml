    dibujo: 🥢
    pregunta: Spring rolls
    correcta: Chinese culture
    incorrectas:
      - texto: India
        feedback: De la India es el korma. Los rollitos de primavera son de la cultura china (**Chinese culture**).
      - texto: Central America
